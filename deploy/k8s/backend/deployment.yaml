apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ai-backend
  namespace: secure-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: secure-ai-backend
  template:
    metadata:
      labels:
        app: secure-ai-backend
    spec:
      containers:
        - name: backend
          image: registry.lab:30500/secure-ai-backend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATA_DIR
              value: /app/data
            - name: OLLAMA_BASE_URL
              value: "http://192.168.2.1:11434"
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: secure-ai-backend-secret
                  key: ADMIN_PASSWORD_HASH
            - name: USER_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: secure-ai-backend-secret
                  key: USER_PASSWORD_HASH
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secure-ai-backend-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1500Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: backend-storage
              mountPath: /app/data
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: secure-ai-backend-pvc
