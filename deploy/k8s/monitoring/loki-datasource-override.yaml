apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-stack
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-stack-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: "http://loki-stack:3100"
      version: 1
      isDefault: false
      jsonData: {}
