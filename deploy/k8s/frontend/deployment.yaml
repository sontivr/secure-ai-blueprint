apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ai-frontend
  namespace: secure-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-ai-frontend
  template:
    metadata:
      labels:
        app: secure-ai-frontend
    spec:
      containers:
        - name: frontend
          image: registry.lab:5000/secure-ai-frontend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: API_BASE_URL
              value: "http://secure-ai-backend.secure-ai.svc.cluster.local"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
