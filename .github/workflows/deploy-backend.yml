name: Deploy Backend to Local k3s

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/k8s/backend/**'
      - 'deploy/k8s/namespace.yaml'
      - 'deploy/k8s/monitoring/**'
      - 'Dockerfile.backend'
      - '.github/workflows/deploy-backend.yml'
      - 'script/**'
      - 'requirements-test.txt'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/k8s/backend/**'
      - 'deploy/k8s/namespace.yaml'
      - 'deploy/k8s/monitoring/**'
      - 'Dockerfile.backend'
      - '.github/workflows/deploy-backend.yml'
      - 'script/**'
      - 'requirements-test.txt'
      - 'README.md'
      - 'docs/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: pip install ruff==0.4.4

      - name: Lint
        run: ruff check backend/ --select=E,F --ignore=E501

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Test
        run: pytest backend/tests/ -v

  deploy:
    runs-on: self-hosted
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - name: Verify kubectl context
        run: kubectl get nodes -o wide

      - name: Deploy backend
        run: ./script/deploy_backend.sh "${GITHUB_SHA::7}"
